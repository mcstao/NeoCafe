#      bash -c "uvicorn Neocafe24.asgi:application --host 0.0.0.0 --port 8001 --reload"
#    env_file:
#      - .env
#    depends_on:
#      - redis

  redis:
    image: "redis:latest"
    ports:
      - "6379:6379"


networks:
  my_custom_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

